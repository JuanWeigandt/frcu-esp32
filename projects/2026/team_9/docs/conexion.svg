<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14">
  <title>Conexionado Aire IoT: ESP32 con BME680, 3 LEDs, buzzer KY-006 y pulsador</title>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <marker id="punto" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="3" fill="#1b2330"/></marker>
  </defs>

  <!-- ESP32 -->
  <rect x="330" y="60" width="240" height="440" rx="8" fill="#f1f4f8" stroke="#1b2330" stroke-width="2"/>
  <text x="450" y="92" text-anchor="middle" font-weight="700" font-size="17">ESP32 DevKit V1</text>
  <text x="450" y="112" text-anchor="middle" fill="#4a5566" font-size="12">ESP32-WROOM-32 · lógica 3,3 V</text>
  <g font-size="13" font-weight="600">
    <text x="342" y="160">3V3</text>
    <text x="342" y="200">GND</text>
    <text x="342" y="240">GPIO 21 (SDA)</text>
    <text x="342" y="280">GPIO 22 (SCL)</text>
    <text x="558" y="160" text-anchor="end">GPIO 25</text>
    <text x="558" y="220" text-anchor="end">GPIO 26</text>
    <text x="558" y="280" text-anchor="end">GPIO 27</text>
    <text x="558" y="360" text-anchor="end">GPIO 32</text>
    <text x="558" y="440" text-anchor="end">GPIO 33</text>
    <text x="558" y="480" text-anchor="end">GND</text>
  </g>

  <!-- BME680 -->
  <rect x="40" y="120" width="170" height="250" rx="6" fill="#eef1fb" stroke="#1b2330" stroke-width="2"/>
  <text x="125" y="148" text-anchor="middle" font-weight="700" font-size="16">BME680</text>
  <g font-size="13" font-weight="600">
    <text x="198" y="175" text-anchor="end">VCC</text>
    <text x="198" y="205" text-anchor="end">GND</text>
    <text x="198" y="245" text-anchor="end">SDA</text>
    <text x="198" y="285" text-anchor="end">SCL</text>
    <text x="198" y="325" text-anchor="end">SDO</text>
    <text x="198" y="355" text-anchor="end">CS</text>
  </g>
  <!-- cables BME680 -->
  <polyline points="210,170 270,170 270,155 330,155" fill="none" stroke="#c62828" stroke-width="3"/>
  <polyline points="210,200 330,200" fill="none" stroke="#1b2330" stroke-width="3"/>
  <polyline points="210,240 330,240" fill="none" stroke="#1565c0" stroke-width="3"/>
  <polyline points="210,280 330,280" fill="none" stroke="#f9a825" stroke-width="3"/>
  <polyline points="210,320 290,320 290,200" fill="none" stroke="#1b2330" stroke-width="3" marker-end="url(#punto)"/>
  <polyline points="210,350 250,350 250,170" fill="none" stroke="#c62828" stroke-width="3" marker-end="url(#punto)"/>
  <text x="40" y="395" font-size="12" fill="#4a5566">SDO a GND → dirección I2C 0x76</text>
  <text x="40" y="413" font-size="12" fill="#4a5566">CS a 3V3 → modo I2C</text>

  <!-- LEDs -->
  <g font-size="13">
    <line x1="570" y1="155" x2="620" y2="155" stroke="#2e7d32" stroke-width="3"/>
    <rect x="620" y="147" width="50" height="16" fill="#fff" stroke="#1b2330"/><text x="645" y="140" text-anchor="middle" font-size="11">330 Ω</text>
    <line x1="670" y1="155" x2="710" y2="155" stroke="#2e7d32" stroke-width="3"/>
    <polygon points="710,143 710,167 732,155" fill="#2e7d32" stroke="#1b2330"/><line x1="732" y1="143" x2="732" y2="167" stroke="#1b2330" stroke-width="2"/>
    <text x="745" y="160">LED verde</text>

    <line x1="570" y1="215" x2="620" y2="215" stroke="#b28704" stroke-width="3"/>
    <rect x="620" y="207" width="50" height="16" fill="#fff" stroke="#1b2330"/><text x="645" y="200" text-anchor="middle" font-size="11">330 Ω</text>
    <line x1="670" y1="215" x2="710" y2="215" stroke="#b28704" stroke-width="3"/>
    <polygon points="710,203 710,227 732,215" fill="#f9c80e" stroke="#1b2330"/><line x1="732" y1="203" x2="732" y2="227" stroke="#1b2330" stroke-width="2"/>
    <text x="745" y="220">LED amarillo</text>

    <line x1="570" y1="275" x2="620" y2="275" stroke="#c62828" stroke-width="3"/>
    <rect x="620" y="267" width="50" height="16" fill="#fff" stroke="#1b2330"/><text x="645" y="260" text-anchor="middle" font-size="11">330 Ω</text>
    <line x1="670" y1="275" x2="710" y2="275" stroke="#c62828" stroke-width="3"/>
    <polygon points="710,263 710,287 732,275" fill="#e53935" stroke="#1b2330"/><line x1="732" y1="263" x2="732" y2="287" stroke="#1b2330" stroke-width="2"/>
    <text x="745" y="280">LED rojo</text>
  </g>
  <!-- cátodos a GND -->
  <polyline points="732,155 732,135 860,135 860,480" fill="none" stroke="#1b2330" stroke-width="2"/>
  <polyline points="732,215 732,235 860,235" fill="none" stroke="#1b2330" stroke-width="2" marker-end="url(#punto)"/>
  <polyline points="732,275 732,295 860,295" fill="none" stroke="#1b2330" stroke-width="2" marker-end="url(#punto)"/>
  <text x="866" y="320" font-size="11" fill="#4a5566" transform="rotate(90 866 320)">bus GND</text>

  <!-- Buzzer -->
  <rect x="690" y="330" width="120" height="60" rx="6" fill="#f3f3f3" stroke="#1b2330" stroke-width="2"/>
  <text x="750" y="355" text-anchor="middle" font-weight="700">KY-006</text>
  <text x="750" y="373" text-anchor="middle" font-size="11" fill="#4a5566">buzzer pasivo</text>
  <polyline points="570,355 690,355" fill="none" stroke="#6a1b9a" stroke-width="3"/>
  <text x="676" y="349" text-anchor="end" font-size="11">S</text>
  <polyline points="810,375 860,375" fill="none" stroke="#1b2330" stroke-width="2" marker-end="url(#punto)"/>
  <text x="818" y="370" font-size="11">−</text>

  <!-- Pulsador -->
  <line x1="570" y1="435" x2="690" y2="435" stroke="#00838f" stroke-width="3"/>
  <circle cx="690" cy="435" r="4" fill="#1b2330"/><circle cx="750" cy="435" r="4" fill="#1b2330"/>
  <line x1="690" y1="420" x2="750" y2="412" stroke="#1b2330" stroke-width="2"/>
  <line x1="720" y1="416" x2="720" y2="400" stroke="#1b2330" stroke-width="2"/><line x1="708" y1="400" x2="732" y2="400" stroke="#1b2330" stroke-width="2"/>
  <text x="720" y="460" text-anchor="middle" font-size="12">pulsador</text>
  <polyline points="750,435 860,435" fill="none" stroke="#1b2330" stroke-width="2" marker-end="url(#punto)"/>
  <polyline points="570,475 860,475 860,480" fill="none" stroke="#1b2330" stroke-width="3"/>

  <text x="40" y="528" font-size="12" fill="#4a5566">Pulsador con pull-up interno en GPIO 33 (INPUT_PULLUP): apretado = LOW. Todo se alimenta del USB del ESP32.</text>
  <text x="40" y="546" font-size="12" fill="#4a5566">Colores de cable: rojo 3V3, negro GND, azul SDA, amarillo SCL.</text>
</svg>
